  # Vehicle Mass & Inertia
  # ----------------------------------------------------------------------------
  mass_empty_kg:
    name: "Unladen Tare Vehicle Mass"
    value: 74000.0
    unit: "kg"
    source: "BEML BH100 / Caterpillar 777G Specification Sheet"
    classification: "DERIVED"
    confidence: "HIGH"
    valid_range: [65000.0, 80000.0]
    notes: "Empty vehicle mass including standard chassis, body, fluids, and operating cab."

  payload_rated_kg:
    name: "Nominal Rated Payload Capacity"
    value: 91500.0
    unit: "kg"
    source: "BEML BH100 Datasheet (91.5 metric tonnes nominal payload)"
    classification: "DERIVED"
    confidence: "HIGH"
