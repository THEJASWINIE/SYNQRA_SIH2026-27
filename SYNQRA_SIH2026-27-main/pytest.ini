[pytest]
# P9 - the main sub-repo needs its own configuration so `pytest` run from THIS
# directory collects this project rather than whatever the parent rootdir names.
#
# `V0_1_BASELINE/` is the FROZEN reference implementation. It is deliberately kept and
# is deliberately NOT collected: its test modules share basenames with the live ones
# (test_physics.py, test_capacity.py, ...), so collecting both makes pytest abort with
# "import file mismatch". Excluding it here leaves the baseline untouched on disk.
testpaths = tests
norecursedirs = V0_1_BASELINE .git __pycache__ node_modules
python_files = test_*.py
