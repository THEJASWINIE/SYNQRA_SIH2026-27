[project]
name = "fog-orchestrator-hmi-backend"
version = "0.1.0"
description = "FOG-ORCHESTRATOR 2.0 Task 1 — HMI backend (M1 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # starlette >=1.6 imports httpx2 in its TestClient and falls back to httpx with a
    # deprecation warning. httpx2 is the version TestClient actually wants.
    "httpx2>=2.12",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 (assert) is the expected idiom in pytest.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
