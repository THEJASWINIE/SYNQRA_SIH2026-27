name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed .env files
        # .env.example is the only permitted env file in version control (NFR-011).
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A .env file is committed. Remove it; commit .env.example only."
            exit 1
          fi
          echo "No committed .env files."
      - name: No credential literals in source
        run: |
          if grep -rInE '(password|passwd|secret|api[_-]?key|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}' \
              --include='*.ts' --include='*.tsx' --include='*.py' --include='*.json' \
              --include='*.yml' --include='*.yaml' \
              frontend/src backend/app backend/tests; then
            echo "Possible hard-coded credential. Move it to the environment (NFR-011)."
            exit 1
          fi
          echo "No credential literals found."
